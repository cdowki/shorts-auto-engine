name: Render Shorts Video

on:
  repository_dispatch:
    types: [render_shorts]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 및 나눔 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-nanum

          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-*/policy.xml || true
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/g' /etc/ImageMagick-*/policy.xml || true

          sudo sed -i '/<policy domain="resource" name="width"/d' /etc/ImageMagick-*/policy.xml || true
          sudo sed -i '/<policy domain="resource" name="height"/d' /etc/ImageMagick-*/policy.xml || true

          fc-cache -f -v

          pip install moviepy==1.0.3 requests google-auth google-api-python-client gtts pillow numpy

      - name: 쇼츠 렌더링 실행
        env:
          TITLE: ${{ github.event.client_payload.title }}
          SCRIPT: ${{ github.event.client_payload.script }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python render_shorts.py

      - name: MP4 파일 아티팩트 보관
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: output_shorts.mp4
