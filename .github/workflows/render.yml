name: Render Shorts Video
on:
  repository_dispatch:
    types: [render_shorts]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: 필수 도구 및 라이브러리 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-nanum
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/g' /etc/ImageMagick-6/policy.xml
          pip install moviepy==1.0.3 requests
      - name: 렌더링 및 드라이브 전송 실행
        env:
          TITLE: ${{ github.event.client_payload.title }}
          SCRIPT: ${{ github.event.client_payload.script }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url }}
          DRIVE_FOLDER_ID: ${{ github.event.client_payload.drive_folder_id }}
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url }}
        run: python render_shorts.py
