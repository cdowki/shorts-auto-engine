name: Render Shorts Video

on:
  repository_dispatch:
    types: [render_shorts]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 프로그램 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-nanum
          sudo fc-cache -fv
          pip install moviepy==1.0.3 requests google-auth google-api-python-client gtts pillow numpy

      - name: ImageMagick 제한 해제
        run: |
          POLICY=$(find /etc/ImageMagick* -name policy.xml | head -n 1)
          echo "policy: $POLICY"
          sudo sed -i 's/rights="none"/rights="read|write"/g' "$POLICY"
          sudo sed -i '/pattern="@\*"/d' "$POLICY"
          sudo sed -i '/name="width"/d' "$POLICY"
          sudo sed -i '/name="height"/d' "$POLICY"
          sudo sed -i 's/name="memory" value=".*"/name="memory" value="2GiB"/' "$POLICY"
          sudo sed -i 's/name="disk" value=".*"/name="disk" value="4GiB"/' "$POLICY"

      - name: 쇼츠 렌더링
        env:
          TITLE: ${{ github.event.client_payload.title }}
          SCRIPT: ${{ github.event.client_payload.script }}
          BG_KEYWORD: ${{ github.event.client_payload.bg_keyword }}
          ROW: ${{ github.event.client_payload.row }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          TAGS: ${{ github.event.client_payload.tags }}
          IMAGE_FOLDER_ID: ${{ github.event.client_payload.image_folder_id }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: python render_shorts.py

      - name: 결과 영상 보관
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: output_shorts.mp4
          if-no-files-found: warn
