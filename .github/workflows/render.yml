name: Render Shorts Video

on:
  repository_dispatch:
    types: [render_shorts]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 노드 준비 (새 틀 숏폼)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 필요한 프로그램 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-nanum
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra || echo "본고딕 설치 실패 — 새 틀 숏폼은 예전 방식으로 대신함"
          sudo fc-cache -fv
          pip install moviepy==1.0.3 requests google-auth google-api-python-client gtts pillow numpy
          pip install scipy || echo "scipy 설치 실패 — 새 틀 숏폼은 예전 방식으로 대신함"
          npm install -g @anthropic-ai/claude-code || echo "클로드 설치 실패 — 새 틀 숏폼은 예전 방식으로 대신함"

      - name: ImageMagick 제한 해제
        run: |
          POLICY=$(find /etc/ImageMagick* -name policy.xml | head -n 1)
          echo "policy: $POLICY"
          sudo sed -i 's/rights="none"/rights="read|write"/g' "$POLICY"
          sudo sed -i '/pattern="@\*"/d' "$POLICY"
          sudo sed -i '/name="width"/d' "$POLICY"
          sudo sed -i '/name="height"/d' "$POLICY"
          sudo sed -i 's/name="memory" value=".*"/name="memory" value="2GiB"/' "$POLICY"
          sudo sed -i 's/name="disk" value=".*"/name="disk" value="4GiB"/' "$POLICY"

      - name: 쇼츠 렌더링
        env:
          TITLE: ${{ github.event.client_payload.title }}
          SCRIPT: ${{ github.event.client_payload.script }}
          BG_KEYWORD: ${{ github.event.client_payload.bg_keyword }}
          ROW: ${{ github.event.client_payload.row }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          TAGS: ${{ github.event.client_payload.tags }}
          IMAGE_FOLDER_ID: ${{ github.event.client_payload.image_folder_id }}
          AI_IMAGES: ${{ github.event.client_payload.ai_images }}
          NEW_STYLE: ${{ (github.event.client_payload.ai_images == '1' && contains(github.event.client_payload.blog_link, 'newcp2024')) && '1' || '' }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BLOG_LINK: ${{ github.event.client_payload.blog_link }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          MAKE_IG_WEBHOOK_URL: ${{ secrets.MAKE_IG_WEBHOOK_URL }}
        run: python render_shorts.py

      - name: 결과 영상 보관
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: output_shorts.mp4
          if-no-files-found: warn
