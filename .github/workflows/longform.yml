name: Longform Video (daily)

# 긴 영상(유튜브 1~3분) 서버 묶음 실행 — 쇼츠창 2026-11-04
# 본 실행: 쇼츠 GAS가 매일 10시대 KST(09시 쇼츠 렌더링 뒤)에 repository_dispatch "longform_daily"로 부름(11/5 — 깃허브 예약이 빠진 뒤).
# 만드는 글은 쇼츠와 같은 전날 글(본문은 전날 오후에 드라이브에 이미 있음).
# 예비: 깃허브 예약 11:37 KST(02:37 UTC). 이미 만든 글은 다시 만들지 않고, 할 일이 없으면 메일도 안 보냄.
# 첫 2일은 그림자 운행: 영상은 릴리스에만 올리고 유튜브에는 올리지 않음.

on:
  repository_dispatch:
    types: [longform_daily]
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '이 글만 다시 만들기 (예: 20261105_r1). 비우면 평소대로'
        required: false
        default: ''
      max:
        description: '한 번에 만들 글 수 (기본 4)'
        required: false
        default: '4'

concurrency:
  group: longform-daily
  cancel-in-progress: false

jobs:
  longform:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 노드 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 프로그램 설치 (ffmpeg · 한국어 글꼴 · 클로드)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          ls -la /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc /usr/share/fonts/opentype/noto/NotoSansCJK-Black.ttc
          pip install pillow numpy scipy
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: 긴 영상 만들기
        id: run
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          ONLY_POST: ${{ github.event.inputs.only }}
          MAX_POSTS: ${{ github.event.inputs.max || '4' }}
          START_ID: '20261104'
          RUN_EVENT: ${{ github.event_name }}
        run: node longform/run_daily.js

      - name: 기록 저장 (만든 글 · 창고 사용/부족 기록 · 장면표)
        if: always()
        run: |
          git config user.name "longform-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in longform/done.json longform/창고_사용기록.json longform/창고_부족기록.json longform/jobs/*/scenes.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "저장할 기록 없음"
          else
            git commit -m "긴 영상 기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi

      - name: 실행 기록 보관 (3일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longform-logs
          path: longform/logs/
          retention-days: 3
          if-no-files-found: ignore

      - name: 실패 표시
        if: steps.run.outcome == 'failure'
        run: |
          echo "긴 영상 만들기에서 실패가 있었습니다. 위 '긴 영상 만들기' 단계 기록과 결과 메일을 보십시오."
          exit 1
